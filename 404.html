<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hotdocx</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect (user/org pages root)
      // Redirect unknown paths to the TanStack Start SPA shell.
      // Source pattern: https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var pathSegmentsToKeep = 0;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            '/_shell.html?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
